[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lazy-coding"
version = "1.0.0"
description = "AI Coding Agentic Platform - Zero-install, token-efficient, agent-native"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "lazy-coding" }]

[project.scripts]
lazy-coding = "lazy_master.cli:main"

[tool.uv.workspace]
members = [
    "lazy_core",
    "lazy_pool",
    "lazy_gate",
    "lazy_master",
    "lazy_view",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
