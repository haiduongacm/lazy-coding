[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lazy-master"
version = "1.0.0"
description = "Multi-agent orchestrator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "lazy-coding" }]
dependencies = ["lazy-core"]

[project.scripts]
lazy-master = "lazy_master.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
