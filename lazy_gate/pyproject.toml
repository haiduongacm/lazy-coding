[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lazy-gate"
version = "1.0.0"
description = "Git gate + pipeline validation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "lazy-coding" }]
dependencies = ["lazy-core"]

[project.scripts]
lazy-gate = "lazy_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

